spring.application.name=backend

# Datasource is provided through environment variables; never commit credentials.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/encryption}
spring.datasource.username=${DB_USERNAME:encryption}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.shutdown=graceful

# Sessions are server-side and cookie-only. The Secure flag is off locally (HTTP)
# and must be enabled in production through SESSION_COOKIE_SECURE=true.
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.path=/
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

spring.jackson.deserialization.fail-on-unknown-properties=true

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
