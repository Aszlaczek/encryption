server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # The backend accepts at most 65 536 B. The extra headroom lets the backend
    # produce its RFC 9457 response for bodies between 64 KiB and 128 KiB.
    client_max_body_size 128k;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Public read-only health endpoint used by Docker and by manual checks.
    location = /actuator/health {
        proxy_pass http://backend:8080/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Missing hashed assets must be a real 404, not the SPA shell.
    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Requests above client_max_body_size must not fall back to an nginx HTML
    # page: keep the documented problem+json contract.
    error_page 413 = @payload_too_large;

    location @payload_too_large {
        default_type application/problem+json;
        add_header Cache-Control "no-store" always;
        return 413 '{"type":"about:blank","title":"Content Too Large","status":413,"code":"PAYLOAD_TOO_LARGE","detail":"Żądanie przekracza 65 536 bajtów.","instance":"$request_uri","traceId":"$request_id"}';
    }
}
